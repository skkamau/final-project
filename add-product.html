<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product | Inventory Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body id="add-product">
  <header class="site-header"><div class="header-content">
    <a class="brand" href="index.html">Inventory Tracker</a>
    <nav aria-label="Main navigation"><a href="index.html">Dashboard</a><a href="add-product.html" aria-current="page">Add Product</a><a href="inventory.html">Inventory</a></nav>
  </div></header>
  <main>
    <div class="page-heading"><div><h1>Add Product</h1><p>Enter the product details below.</p></div></div>
    <p id="storage-message" class="message error" role="alert" hidden></p>
    <noscript><p class="message error">Please enable JavaScript to add products.</p></noscript>
    <div class="form-layout">
      <section class="panel" aria-labelledby="product-details-heading">
        <h2 id="product-details-heading">Product details</h2><p>All fields are required. Prices are in Kenyan shillings (KSh).</p>
        <!-- novalidate lets our JavaScript show clear, consistent error messages. -->
        <form id="product-form" novalidate>
          <div class="field"><label for="product-name">Product name</label><input id="product-name" name="productName" type="text" placeholder="e.g. Exercise book" required aria-describedby="name-error"><span id="name-error" class="field-error"></span></div>
          <div class="field"><label for="category">Category</label><input id="category" name="category" type="text" placeholder="e.g. Stationery" required aria-describedby="category-error"><span id="category-error" class="field-error"></span></div>
          <div class="field-grid">
            <div class="field"><label for="quantity">Quantity</label><input id="quantity" name="quantity" type="number" min="0" step="1" placeholder="0" required aria-describedby="quantity-error"><span id="quantity-error" class="field-error"></span></div>
            <div class="field"><label for="unit-price">Unit price (KSh)</label><input id="unit-price" name="unitPrice" type="number" min="0" step="any" placeholder="0.00" required aria-describedby="price-error"><span id="price-error" class="field-error"></span></div>
          </div>
          <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
          <button type="submit">Save Product</button>
        </form>
      </section>
      <section class="panel latest-panel" aria-labelledby="latest-heading"><h2 id="latest-heading">Latest added product</h2><div id="latest-product"></div><a class="text-link" href="inventory.html">View inventory</a></section>
    </div>
  </main>
  <footer><p>Inventory Tracker · School project</p></footer>
</body>
</html>
